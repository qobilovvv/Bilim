services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    networks:
      - shared_network
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  postgres-db:
    image: postgres:15-alpine
    networks:
      - shared_network
    ports:
      - "${POSTGRES_EXPOSED_PORT:-6666}:5432"
    env_file:
      - .env
    volumes:
      - .volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  redis-db:
    image: redis:7-alpine
    networks:
    - shared_network
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    restart: always
    volumes:
      - .volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

networks:
  shared_network:
    driver: bridge

volumes:
  media_data:
