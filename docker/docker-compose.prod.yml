services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips ${TRUSTED_PROXY_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    networks:
      - shared_network
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - ../.env
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 2G

  postgres-db:
    image: postgres:15-alpine
    networks:
      - shared_network
    env_file:
      - ../.env
    volumes:
      - .volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  shared_network:
    driver: bridge

volumes:
  media_data:
