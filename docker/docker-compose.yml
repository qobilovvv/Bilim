services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    networks:
      - shared_network
    depends_on:
      postgres-db:
        condition: service_healthy
    env_file:
      - ./../.env
    volumes:
      - ./../src:/app/src:delegated
      - ./../alembic.ini:/app/alembic.ini:delegated
      - ./../alembic:/app/alembic:delegated
      - ./../scripts:/app/scripts:delegated
      - media_data:/app/media

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres-db:
    image: postgres:15-alpine
    networks:
      - shared_network
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSED_PORT:-6666}:5432"
    env_file:
      - ./../.env
    volumes:
      - .volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20


networks:
  shared_network:
    driver: bridge

volumes:
  media_data:
