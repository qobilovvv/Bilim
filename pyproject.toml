[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "silent"
files = ["src/security/tokens.py", "src/security/localization.py", "src/schemas/validation.py", "src/infrastructure/config.py"]
