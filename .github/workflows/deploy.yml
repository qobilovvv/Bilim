name: Backend checks and deployment

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bilim_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: bilim_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U bilim_test -d bilim_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://bilim_test:test_only_password@127.0.0.1:5432/bilim_test
      TEST_DATABASE_URL: postgresql+asyncpg://bilim_test:test_only_password@127.0.0.1:5432/bilim_test
      JWT_SECRET_KEY: ci_only_8c86b482fabf4621be7709868d4a098a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check src tests scripts alembic
      - run: ruff format --check src tests scripts alembic
      - run: mypy
      - run: pytest -q
      - name: Build and smoke-test release image
        run: |
          set -eu
          docker build -f docker/Dockerfile -t bilim:check .
          test "$(docker image inspect bilim:check --format '{{.Config.User}}')" = app
          docker run --rm --entrypoint test bilim:check -d /app/alembic/versions
          docker run -d --name bilim-check --network host -e DATABASE_URL -e JWT_SECRET_KEY -e APP_ENV bilim:check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 2
          done
          docker logs bilim-check
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f bilim-check || true

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: bilim-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested revision via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: RELEASE_SHA
          script_stop: true
          script: |
            set -eu
            cd /var/www/bilim
            git diff --quiet
            git diff --cached --quiet
            git fetch origin "$RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            docker compose --env-file .env -f docker/docker-compose.prod.yml build api
            docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --wait postgres-db
            docker compose --env-file .env -f docker/docker-compose.prod.yml run --rm --no-deps api alembic upgrade head
            docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --no-build --wait --wait-timeout 120 api
